name: diag-cdp

on:
  workflow_dispatch:
  push:
    branches: [feat/match-cards-turn-by-turn]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Baseline facts
        run: |
          echo "TEMP=[${TEMP-unset}] TMPDIR=[${TMPDIR-unset}] RUNNER_TEMP=[${RUNNER_TEMP-unset}]"
          google-chrome --version
          ls -l /usr/bin/google-chrome
          readlink -f /usr/bin/google-chrome
          id
          df -h /tmp /dev/shm | cat

      - name: Launch with TEMP fallback (/tmp) and no concurrency
        run: |
          profile="/tmp/pba-verify-profile"
          rm -rf "$profile"
          google-chrome --headless=new --disable-gpu --no-first-run --no-default-browser-check \
            --remote-debugging-port=9222 --user-data-dir="$profile" about:blank \
            > chrome.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9222/json/version; then echo "CDP UP after $i"; break; fi
            sleep 0.25
          done
          echo "--- chrome alive? ---"
          kill -0 $pid 2>&1 && echo alive || echo dead
          echo "--- chrome.log ---"
          cat chrome.log
          echo "--- live chrome procs ---"
          pgrep -af chrome | head -5 || true

      - name: Launch WITHOUT --user-data-dir
        run: |
          pkill -f chrome || true
          sleep 1
          google-chrome --headless=new --disable-gpu --no-first-run --remote-debugging-port=9223 about:blank > chrome2.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9223/json/version; then echo "CDP UP after $i"; break; fi
            sleep 0.25
          done
          echo "--- chrome2.log ---"
          cat chrome2.log

      - name: Run the real script's launch path
        run: |
          pkill -f chrome || true
          sleep 1
          rm -rf /tmp/pba-run4-profile
          node scripts/_diag-cdp.mjs

      - name: Run it a second time on the profile left behind
        run: |
          pkill -f chrome || true
          sleep 2
          echo "--- leftovers ---"; pgrep -af chrome | head -3 || true
          node scripts/_diag-cdp.mjs
