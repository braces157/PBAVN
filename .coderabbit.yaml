# CodeRabbit configuration. Read by the GitHub App and by remote reviews.
#
# The instructions below are the ones this repository already holds itself to in
# CONTRIBUTING.md. They are here so a reviewer that has not read that file still
# notices when a change breaks the conventions, not to restate style preferences.
language: en-GB
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main

  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!package-lock.json"
    - "!tsconfig.tsbuildinfo"
    # Screenshots are evidence for a pull request, not code to review.
    - "!shots/**"
    - "!docs/**"
    # Regenerated by `npm run refresh-data`; CI already fails when these are stale.
    - "!src/lib/pba/data/**"

  path_instructions:
    - path: "src/lib/pba/*-parse.ts"
      instructions: |
        These parsers read undocumented HTML from the association's scoring terminal,
        so the rules are stricter than normal:

        - A parser imports nothing. No transport, no types module, no helpers. That is
          what lets the test suite run them against saved markup with no network.
        - When the shape is not recognised, return an empty result. Never guess, and
          never treat a placeholder as a zero: `Number("")` is `0`, which has already
          shipped a phantom `tbd` as a real score.
        - A row is a player only when it carries a published value. The column-heading
          row shares the same list markup.
        - Derived numbers must reconcile with an independently published figure (the
          turn record against the set score, the best turn against the high run). Flag
          any new derived value that has nothing to check itself against.

    - path: "src/lib/pba/**"
      instructions: |
        Data flows one way: raw upstream JSON is parsed here, typed in `types.ts`, and
        turned into domain models by `src/lib/normalize.ts`. A raw upstream field or a
        Korean column alias must not escape this directory.

        `http.ts` documents three upstream quirks (no CORS, a broken TLS chain, a
        failure record). A failed read must surface as a failure, not as an empty
        result: an outage that renders as a confident empty state is a bug.

    - path: "src/**"
      instructions: |
        - Filtering lives in the URL as a query parameter rendered as a link; do not add
          a second filtering mechanism or a client-side filter state.
        - Sorting lives in the client over rows the server already rendered; do not add
          a server round trip for a sort.
        - A client component cannot receive a render function from a server component.
          Pass serialisable values across that boundary.
        - Comments explain why. Flag comments that restate what the code already shows,
          and flag non-obvious behaviour that has no comment.

    - path: "tests/**"
      instructions: |
        Assert behaviour a user can observe, against the saved upstream markup in
        `tests/fixtures`, so a test fails when the behaviour breaks and keeps passing
        when only internals move. A fixture change is a change to the contract these
        parsers are written against: say so when it happens silently.

    - path: ".github/workflows/**"
      instructions: |
        Workflows are gated on time and on secrets. Flag a step that would fail on a
        fork pull request, one that needs a secret without saying so, and one that
        makes a pull request red for a reason the author cannot fix.

chat:
  auto_reply: true
